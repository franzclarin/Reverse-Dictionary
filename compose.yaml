# Two services, one image. `web` serves the app; `lab` serves the notebooks over
# both Python environments. Same layers, different command, so building either
# builds both.
#
#   docker compose up web     ->  http://127.0.0.1:3000
#   docker compose up lab     ->  http://127.0.0.1:8888
#
# The database is NOT here. It points at the same hosted database local
# development and production use, because the index is far too big to be in this
# repo and a local empty one would just return nothing.
#
# `lab/compose.yaml` still exists as the standalone, Python-only container. This
# file is the whole project.

name: reverse-dictionary

services:
  web:
    build: .
    image: reverse-dictionary:latest
    container_name: rd-web
    env_file:
            # The database address. Not needed to build, but the app is useless
            # without it at run time.
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
    ports:
            # Local machine only: the app has no login and no request limits by
            # design. Publish it more widely only deliberately.
      - "127.0.0.1:3000:3000"

  lab:
    build: .
    image: reverse-dictionary:latest
    container_name: rd-notebooks
        # A different name from the standalone container's, so both can run at once.
    env_file:
      - path: .env.local
        required: false
    environment:
            # Which Python environment a login shell gets. Needed because a login
            # shell resets the path and would otherwise hand back the base image's
            # python, with none of the packages installed.
      RD_VENV: /opt/venv-lab
      JUPYTER_PLATFORM_DIRS: "1"
      HF_HOME: /app/training/artifacts/hf
      EVAL_CELL_DIR: /app/data/cells
      RD_SOURCE_DIR: /app/data/sources
    ports:
            # Local machine only, and not negotiable: the notebook server runs with no
            # password. Do not publish this to a network.
      - "127.0.0.1:8888:8888"
        # The image's health check looks at the web port, which only `web` serves.
        # Inherited here it would mark a perfectly healthy notebook server unhealthy.
    healthcheck:
      disable: true
    volumes:
            # Notebooks and results are the work — they must outlive the container.
      - ./training/notebooks:/app/training/notebooks
      - ./training/artifacts:/app/training/artifacts
      - ./lab/notebooks:/app/lab/notebooks
      - ./lab/artifacts:/app/lab/artifacts

            # --- read-only, and that is the point ---------------------------------
            # The frozen benchmark and its reference runs. It is only a valid
            # benchmark for as long as nothing can rewrite it, so nothing here can.
      - ./eval:/app/eval:ro

            # The dictionary is NOT mounted: it already ships inside the image, which
            # is where the code looks for it. (Its files are not UTF-8 — reading them
            # as UTF-8 silently mangles headwords.)

            # The large downloaded dictionary sources. Read-only: the filter reads
            # these, and its committed record is the account of what it did.
      - ${RD_SOURCE_DIR:-${HOME}/rd_sources}:/app/data/sources:ro

      # Vector cells, ~170 MB each. Writable, and outside the image on purpose —
      # the darwin default lives under os.tmpdir() and gets reaped.
      - ${EVAL_CELL_DIR:-${HOME}/rd_eval_cells}:/app/data/cells

    # Absolute path, not `jupyter`: this server is the lab surface, and naming
    # the interpreter removes any question of which venv PATH resolved to. Both
    # kernels — `reverse-dictionary` (training/) and `reverse-dictionary-lab` —
    # are registered system-wide, so this one server offers both.
    command:
      - /opt/venv-lab/bin/jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.root_dir=/app
      - --ServerApp.token=
      - --ServerApp.password=
