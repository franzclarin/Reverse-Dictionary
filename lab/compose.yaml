# The container is the portable surface, not the fast one: Docker on macOS
# cannot reach the GPU, so this is CPU-only. Do the real work on the host; use
# this for reproducibility, or for handing the environment to someone else.
#
#   docker compose up --build     ->  http://localhost:8888

services:
  lab:
    build: .
    container_name: rd-lab
    working_dir: /workspace
    ports:
            # Local machine only, on purpose: the server runs with no password, so it
            # must not be reachable from the network.
      - "127.0.0.1:8888:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./artifacts:/workspace/artifacts

            # --- read-only, and that is the point -------------------------------
            # The frozen benchmark and its reference runs. It is only a valid
            # benchmark for as long as nothing can rewrite it, so nothing here can.
      - ../eval:/workspace/eval:ro

            # The dictionary, shipped by the app's own dependencies.
            # Note: its files are not UTF-8, and reading them as UTF-8 silently
            # mangles headwords.
      - ../node_modules/wordnet-db/dict:/workspace/data/wordnet:ro

            # The large downloaded dictionary sources.
      - ${RD_SOURCE_DIR:-${HOME}/rd_sources}:/workspace/data/sources:ro
    environment:
            # Jupyter's own cache and settings, kept inside the container.
      JUPYTER_PLATFORM_DIRS: "1"
      HF_HOME: "/workspace/artifacts/hf"
